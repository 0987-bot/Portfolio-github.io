<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Portfolio</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 0 1.5rem;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 4rem 0;
    }

    /* Header */
    header {
      margin-bottom: 3rem;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1.1rem;
    }

    /* Video Grid */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .video-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .video-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .preview-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000;
      overflow: hidden;
    }

    .preview-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Play overlay indicator */
    .play-badge {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.35);
      transition: background 0.2s ease;
    }

    .play-badge svg {
      width: 44px;
      height: 44px;
      fill: #ffffff;
      opacity: 0.85;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .video-card:hover .play-badge svg {
      transform: scale(1.15);
      opacity: 1;
    }

    .video-info {
      padding: 1rem 1.25rem;
    }

    .video-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .video-desc {
      color: var(--muted);
      font-size: 0.85rem;
    }

    /* Fullscreen Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .modal video {
      width: 100%;
      max-height: 80vh;
      border-radius: 8px;
      background: #000;
      outline: none;
    }

    .modal-close {
      position: absolute;
      top: -45px;
      right: 0;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
    }

    .modal-title {
      margin-top: 1rem;
      font-size: 1.25rem;
      color: var(--text);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Video Portfolio</h1>
      <p class="subtitle">Click any project to watch in full view</p>
    </header>

    <div class="video-grid">

      <!-- Video Item 1 -->
      <div class="video-card" onclick="openFullscreen('videos/clip1.mp4', 'Nissan GTR R35 Edit')">
        <div class="preview-container">
          <video muted loop playsinline preload="metadata" onmouseover="this.play()" onmouseout="this.pause()">
            <source src="videos/clip1.mp4" type="video/mp4" />
          </video>
          <div class="play-badge">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
        <div class="video-info">
          <h3 class="video-title">Nissan GTR R35 Edit</h3>
          <p class="video-desc">Cinematic color grade & sound design</p>
        </div>
      </div>

      <!-- Video Item 2 -->
      <div class="video-card" onclick="openFullscreen('videos/clip2.mp4', 'Toyota GT86 Night Drive')">
        <div class="preview-container">
          <video muted loop playsinline preload="metadata" onmouseover="this.play()" onmouseout="this.pause()">
            <source src="videos/clip2.mp4" type="video/mp4" />
          </video>
          <div class="play-badge">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
        <div class="video-info">
          <h3 class="video-title">Toyota GT86 Night Drive</h3>
          <p class="video-desc">Fast-cut rhythm editing</p>
        </div>
      </div>

      <!-- Video Item 3 -->
      <div class="video-card" onclick="openFullscreen('videos/clip3.mp4', 'BMW M3 Showcase')">
        <div class="preview-container">
          <video muted loop playsinline preload="metadata" onmouseover="this.play()" onmouseout="this.pause()">
            <source src="videos/clip3.mp4" type="video/mp4" />
          </video>
          <div class="play-badge">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
        <div class="video-info">
          <h3 class="video-title">BMW M3 Showcase</h3>
          <p class="video-desc">Automotive reel showcase</p>
        </div>
      </div>

    </div>
  </div>

  <!-- Fullscreen Modal Player -->
  <div class="modal" id="videoModal" onclick="closeOnBackdrop(event)">
    <div class="modal-content">
      <button class="modal-close" onclick="closeFullscreen()">&times;</button>
      <video id="fullVideo" controls playsinline></video>
      <div class="modal-title" id="modalTitle"></div>
    </div>
  </div>

  <script>
    const modal = document.getElementById('videoModal');
    const fullVideo = document.getElementById('fullVideo');
    const modalTitle = document.getElementById('modalTitle');

    function openFullscreen(src, title) {
      modalTitle.textContent = title;
      fullVideo.src = src;
      modal.classList.add('active');
      fullVideo.play();

      // Trigger browser native full screen mode if supported
      if (fullVideo.requestFullscreen) {
        fullVideo.requestFullscreen().catch(() => {});
      } else if (fullVideo.webkitRequestFullscreen) {
        fullVideo.webkitRequestFullscreen();
      }
    }

    function closeFullscreen() {
      fullVideo.pause();
      fullVideo.src = '';
      modal.classList.remove('active');

      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }
    }

    function closeOnBackdrop(e) {
      if (e.target === modal) {
        closeFullscreen();
      }
    }

    // Close on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeFullscreen();
      }
    });
  </script>

</body>
</html>
