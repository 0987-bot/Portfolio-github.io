<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Portfolio</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 0 1.5rem;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 4rem 0;
    }

    header {
      margin-bottom: 3rem;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1.1rem;
    }

    /* Video Grid */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .video-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .video-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .thumbnail-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000;
      overflow: hidden;
    }

    .thumbnail-container img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .video-card:hover .thumbnail-container img {
      transform: scale(1.05);
    }

    /* Play Icon Overlay */
    .play-badge {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.35);
      transition: background 0.2s ease;
    }

    .play-badge svg {
      width: 48px;
      height: 48px;
      fill: #ffffff;
      opacity: 0.9;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .video-card:hover .play-badge svg {
      transform: scale(1.15);
      opacity: 1;
    }

    .video-info {
      padding: 1rem 1.25rem;
    }

    .video-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .video-desc {
      color: var(--muted);
      font-size: 0.85rem;
    }

    /* Modal / Pop-up Player */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 900px;
      position: relative;
    }

    .video-wrapper {
      position: relative;
      padding-top: 56.25%; /* 16:9 */
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .modal-close {
      position: absolute;
      top: -45px;
      right: 0;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Video Portfolio</h1>
      <p class="subtitle">Click any project to play</p>
    </header>

    <div class="video-grid">

      <!-- ITEM 1: Replace 'dQw4w9WgXcQ' with your YouTube Video ID -->
      <div class="video-card" onclick="openModal('jRmsatr9p7g')">
        <div class="thumbnail-container">
          <img src="https://img.youtube.com/vi/jRmsatr9p7g/hqdefault.jpg" alt="Nissan GTR Edit" />
          <div class="play-badge">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
        <div class="video-info">
          <h3 class="video-title">Nissan GTR R35 Edit</h3>
          <p class="video-desc">Cinematic color grading and pacing.</p>
        </div>
      </div>

      <!-- ITEM 2: Replace 'dQw4w9WgXcQ' with your YouTube Video ID -->
      <div class="video-card" onclick="openModal('dQw4w9WgXcQ')">
        <div class="thumbnail-container">
          <img src="https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg" alt="Toyota GT86 Reel" />
          <div class="play-badge">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
        <div class="video-info">
          <h3 class="video-title">Toyota GT86 Reel</h3>
          <p class="video-desc">Fast-paced automotive sequence.</p>
        </div>
      </div>

    </div>
  </div>

  <!-- Player Modal -->
  <div class="modal" id="videoModal" onclick="closeOnBackdrop(event)">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div class="video-wrapper">
        <iframe id="youtubeFrame" allow="autoplay; fullscreen" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script>
    const modal = document.getElementById('videoModal');
    const iframe = document.getElementById('youtubeFrame');

    function openModal(videoId) {
      // Autoplay starts automatically on open
      iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
      modal.classList.add('active');
    }

    function closeModal() {
      // Clear src to immediately stop playback
      iframe.src = '';
      modal.classList.remove('active');
    }

    function closeOnBackdrop(e) {
      if (e.target === modal) {
        closeModal();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeModal();
      }
    });
  </script>

</body>
</html>
