<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moinak Paul — Video Editing Portfolio</title>
  <style>
    :root {
      --bg: #030007;
      --card-bg: #0d0617;
      --text: #ffffff;
      --muted: #a78bfa;
      --accent: #a855f7; /* Vibrant purple neon */
      --border: rgba(168, 85, 247, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Top Navigation Bar */
    nav {
      background-color: rgba(3, 0, 7, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-logo {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: var(--text);
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: #ffffff;
      text-shadow: 0 0 8px rgba(168, 85, 247, 0.8);
    }

    /* Purple Neon Hero Banner */
    .hero {
      position: relative;
      width: 100%;
      min-height: 450px;
      background: radial-gradient(circle at 50% 20%, rgba(126, 34, 206, 0.4) 0%, rgba(3, 0, 7, 0.95) 70%),
                  #030007;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .hero-tag {
      font-family: 'Brush Script MT', cursive, sans-serif;
      font-size: 2.2rem;
      color: #d8b4fe;
      text-shadow: 0 0 12px rgba(168, 85, 247, 0.8);
      margin-bottom: -1rem;
      z-index: 2;
      transform: rotate(-3deg);
    }

    .hero h1 {
      font-size: clamp(2.5rem, 6vw, 5.5rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 0 25px rgba(168, 85, 247, 0.6);
      margin: 0.5rem 0;
    }

    .hero-subtag {
      font-family: 'Brush Script MT', cursive, sans-serif;
      font-size: 2.4rem;
      color: #d8b4fe;
      text-shadow: 0 0 12px rgba(168, 85, 247, 0.8);
      margin-top: -1.2rem;
      z-index: 2;
      transform: rotate(2deg);
    }

    /* Main Container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 4rem 2rem 6rem;
    }

    /* Section Headings */
    .section-title {
      font-size: 1.6rem;
      font-weight: 800;
      margin: 4rem 0 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
      letter-spacing: 0.02em;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .section-title::before {
      content: "";
      width: 8px;
      height: 22px;
      background-color: var(--accent);
      border-radius: 2px;
      box-shadow: 0 0 10px var(--accent);
    }

    /* Grids */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.75rem;
    }

    .reels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.75rem;
    }

    /* Thumbnail-Only Video Cards */
    .video-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
    }

    .video-card:hover {
      transform: translateY(-6px);
      border-color: var(--accent);
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.35);
    }

    .thumbnail-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      overflow: hidden;
    }

    .reel-thumbnail-container {
      position: relative;
      width: 100%;
      padding-top: 177.77%;
      background: #000;
      overflow: hidden;
    }

    .thumbnail-container img,
    .reel-thumbnail-container img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
    }

    .video-card:hover img {
      transform: scale(1.06);
    }

    .play-badge {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(3, 0, 7, 0.45);
      transition: background 0.2s ease;
    }

    .play-badge svg {
      width: 48px;
      height: 48px;
      fill: #ffffff;
      filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.8));
      opacity: 0.95;
      transition: transform 0.2s ease;
    }

    .video-card:hover .play-badge svg {
      transform: scale(1.15);
    }

    /* Modal Player */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(3, 0, 7, 0.95);
      backdrop-filter: blur(10px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 900px;
      position: relative;
    }

    .modal-content.is-reel {
      max-width: 420px;
    }

    .video-wrapper {
      position: relative;
      padding-top: 56.25%;
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(168, 85, 247, 0.4);
      border: 1px solid var(--accent);
    }

    .modal-content.is-reel .video-wrapper {
      padding-top: 177.77%;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .modal-close {
      position: absolute;
      top: -45px;
      right: 0;
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 2.2rem;
      cursor: pointer;
      text-shadow: 0 0 10px rgba(168, 85, 247, 0.8);
    }

    @media (max-width: 768px) {
      nav {
        padding: 1rem;
      }
      .nav-links {
        display: none;
      }
    }
  </style>
</head>

  <!-- Player Modal -->
  <div class="modal" id="videoModal" onclick="closeOnBackdrop(event)">
    <div class="modal-content" id="modalContainer">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div class="video-wrapper">
        <iframe id="youtubeFrame" allow="autoplay; fullscreen" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script>
    const modal = document.getElementById('videoModal');
    const modalContainer = document.getElementById('modalContainer');
    const iframe = document.getElementById('youtubeFrame');

    function openModal(videoId, isReel) {
      if (isReel) {
        modalContainer.classList.add('is-reel');
      } else {
        modalContainer.classList.remove('is-reel');
      }

      iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
      modal.classList.add('active');
    }

    function closeModal() {
      iframe.src = '';
      modal.classList.remove('active');
    }

    function closeOnBackdrop(e) {
      if (e.target === modal) {
        closeModal();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeModal();
      }
    });
  </script>
